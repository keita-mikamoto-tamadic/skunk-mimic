# mimic_v2_5 実機運転 (state machine 経由の通常運転フロー)。
#
# dataflow.yaml (v2 実機) の v2_5 版。dummy_input (端末) の代わりに
# robot_web_gui (ブラウザ) で state 遷移をトリガする。
#
#   robot_web_gui ──state_command──▶ robot_control_manager ──motor_commands──▶ device_control_manager (can0+can1)
#        ▲                              │  ▲                                     │
#        └────────state_status──────────┘  └── run_command ── stabilizer ◀───────┤ motor_status / imu_data
#                                                                                └◀─ raw_imu ── imu_node
#
# 起動 (全部 robot 上。PC 側に dora は不要):
#   1) robot: bash pcan_setup.bash can0 can1 keep
#   2) robot: bash keep_serial_open.bash        (別ターミナル、IMU)
#   3) robot: bash dora_rt_damon.bash           (別ターミナル)
#   4) robot: dora start dataflow_mimic.yaml
#   5) robot: cd src/python && \
#             ROBOT_CONFIG=robot_config/mimic_v2_5.json uv run robot_web_gui/robot_web_gui.py
#             (dynamic ノードが attach するまで dataflow は開始バリアで待つ)
#   6) PC のブラウザで http://<robot-ip>:8766/
#   robot 側の生データ表示 (任意、dataflow 非依存の pull 型なので起動手順に影響しない):
#             cd src/python && ROBOT_CONFIG=robot_config/mimic_v2_5.json python3 data_viewer.py
#   表示側:   DORA_COORDINATOR_ADDR=<robot-ip> ROBOT_CONFIG=robot_config/mimic_v2_5.json \
#             python3 tools/gui/web_monitor.py
#
# 単軸テスト/ゼロ点直接操作は dataflow_mimic_web_control.yaml (state machine バイパス) を使う。
#
# topic inspection (web_monitor の dora topic echo) 用に true を維持。
_unstable_debug:
  enable_debug_inspection: true

nodes:

  - id: robot_control_manager
    path: src/cpp/node/robot_control_manager/build/robot_control_manager
    env:
      ROBOT_CONFIG: robot_config/mimic_v2_5.json
    inputs:
      # 注: v2 の dataflow.yaml にある 30ms watchdog タイマーは繋がない。
      # motor_status 途絶時は moteus 自身の watchdog (100ms, kPositionTimeout)
      # がモータを止めるので RCM 側の検出は冗長で、配送ジッタでの誤発動
      # (勝手に SERVO_OFF) の実害の方が大きい。
      # 操作元の切り替え: robot_web_gui / dualsense_input のどちらか一方
      # (dora の入力は 1 名前 1 ソース)。下の該当ブロックの有効/無効と揃えること。
      # state_command: robot_web_gui/state_command
      state_command: dualsense_input/state_command
      motor_status: device_control_manager/motor_status
      run_command: stabilizer/run_command
    outputs:
      - motor_commands
      - state_status

  - id: stabilizer
    path: src/cpp/node/stabilizer/build/stabilizer
    env:
      ROBOT_CONFIG: robot_config/mimic_v2_5.json
    inputs:
      motor_status: device_control_manager/motor_status
      imu_data: device_control_manager/imu_data
      state_status: robot_control_manager/state_status
      # 走行指令 (~50Hz)。300ms 途絶で 0 扱い (stabilizer 側の安全網)。
      # robot_web_gui に戻すときはこの行も外すこと (ソースが消えると起動エラー)
      drive_command: dualsense_input/drive_command
    outputs:
      - run_command
      - estimated_state

  - id: device_control_manager
    path: src/cpp/node/device_control_manager/build/device_control_manager
    # CAN 制御ループを CPU1 に隔離 (dora が pre_exec で全スレッドに適用)。
    # SCHED_FIFO は DCM 自身がメインスレッドにだけ付ける (init 後)。
    cpu_affinity: [1]
    env:
      ROBOT_CONFIG: robot_config/mimic_v2_5.json
    inputs:
      tick: dora/timer/millis/3
      motor_commands: robot_control_manager/motor_commands
      raw_imu: imu_node/raw_imu
    outputs:
      - motor_status
      - imu_data
      - latency

  - id: imu_node
    path: src/cpp/node/imu_node/build/imu_node
    env:
      ROBOT_CONFIG: robot_config/mimic_v2_5.json   # Step 4 (取り付け回転) で使用
    inputs:
      tick: dora/timer/millis/3
    outputs:
      - raw_imu

  # 操作 GUI ―― robot ローカルの dynamic ノード (分散配置はやめた)。
  # PC daemon への配置 (_unstable_deploy: machine: pc) は zenoh 経由になり、
  # state_command (SERVO_OFF 含む) が数秒届かない・daemon 負荷・WARN 洪水・
  # バージョン一致など問題が多かった。robot 上で動かして PC はブラウザで
  # http://<robot-ip>:8766/ を開くだけにする。robot 側の全経路がローカルになる。
  # dynamic は全 attach まで開始バリアで待つため、常時起動しない data_viewer 等は
  # ここに入れない (表示は data_viewer.py / web_monitor で)。
  # robot_web_gui と dualsense_input は排他 (dora の入力は 1 名前 1 ソース)。
  # 切り替えるときは RCM の state_command のソースと、この 2 ブロックの
  # 有効/無効を必ず揃えること。
  #
  # ブラウザ版 (http://<robot-ip>:8766/)。今は無効。
  # 起動: cd src/python && ROBOT_CONFIG=robot_config/mimic_v2_5.json \
  #         uv run robot_web_gui/robot_web_gui.py
  # - id: robot_web_gui
  #   path: dynamic
  #   inputs:
  #     tick: dora/timer/millis/50          # コマンドキュー drain + RUN リトライ用
  #     state_status: robot_control_manager/state_status
  #     imu_data:                            # 角度/角速度の数値表示用 (333Hz、最新値のみ要)
  #       source: device_control_manager/imu_data
  #       queue_size: 400                    # channel full 対策 (容量=入力 queue_size 合計、既定10)
  #   outputs:
  #     - state_command

  # DualSense (PS5) 版。今はこちらが有効。
  # 起動: cd src/python && uv run dualsense_input/dualsense_input.py
  # パッドが未接続でも起動し、切断しても落ちない (開始バリアを塞がないため)。
  # 切断時: state_command は送らない (RCM の状態を維持)。drive_command は 0 に
  # 戻して送り続ける (加えて stabilizer 側も 300ms 途絶で 0 扱い)。
  # 左スティック上下 = 前後 (±0.5 rad/s、上が前進)。
  # 割り当てと実測根拠は scripts/dualsense_monitor/README.md。
  # 状態/IMU の表示は持たないので、見たいときは別途 pull 型のビューアを使う:
  #   robot: cd src/python && ROBOT_CONFIG=robot_config/mimic_v2_5.json python3 data_viewer.py
  #   PC:    DORA_COORDINATOR_ADDR=<robot-ip> python3 tools/gui/web_monitor.py
  - id: dualsense_input
    path: dynamic
    outputs:
      - state_command
      - drive_command
