# mimic 2チャンネル同時テスト + Web 操作 (ロボット完結構成)。
#
# dataflow_foctive_web_control.yaml の mimic 版。robot_config/mimic_v2_5.json
# (comm_ch: can0=右脚 / can1=左脚) で device_control_manager がチャンネル毎に
# ドライバを開き、6軸を2バスに分配する。state machine (robot_control_manager /
# stabilizer) はバイパスし、ブラウザから直接 motor_commands を送る。
#
# foctive 版と違い web_controller も robot 側 daemon で動かす:
# moteus watchdog (100ms) を食わせる 50Hz ストリームがロボット内で完結するため、
# WiFi 断でモータは止まらない (止めたい時はブラウザの SERVO OFF)。
# PC 側に dora daemon も zenoh も不要 ―― ブラウザで http://<robot-ip>:8770/ を開くだけ。
#
#   ブラウザ(PC) ──HTTP──▶ web_controller (robot) ──motor_commands──▶ device_control_manager (robot, can0+can1)
#
# 設定系(settings_request)は対象外 ―― 必要なら端末版 foctive_controller を使う。
#
# 起動 (全部 robot 上):
#   1) bash pcan_setup.bash can0 can1 keep
#   2) bash dora_rt_damon.bash
#   3) dora start dataflow_mimic_web_control.yaml
#   4) cd src/python && \
#      ROBOT_CONFIG=robot_config/mimic_v2_5.json uv run web_controller/web_controller.py
#   5) PC のブラウザで http://<robot-ip>:8770/
#   表示側:   ROBOT_CONFIG=robot_config/mimic_v2_5.json python3 tools/gui/web_monitor.py
#             (robot 上なら env 追加不要、PC なら DORA_COORDINATOR_ADDR=<robot-ip>)
#
# topic inspection (web_monitor の dora topic echo) 用に true を維持。
_unstable_debug:
  enable_debug_inspection: true

nodes:

  # 操作ノード ―― robot 側 daemon に配置 (deploy 指定なし)。path: dynamic なので
  # robot 上で web_controller.py を手動起動して node id "web_controller" にアタッチ。
  - id: web_controller
    path: dynamic
    inputs:
      tick: dora/timer/millis/20    # 送信キュー drain + 50Hz ストリーム
    outputs:
      - motor_commands

  # デバイス側 ―― deploy 指定なし = 既定マシン(robot, can0+can1)。
  - id: device_control_manager
    path: src/cpp/node/device_control_manager/build/device_control_manager
    env:
      # 相対パスで OK: C++ 側 (robot_config::ResolveConfigPath) が実行ファイル位置から
      # リポジトリルートを導出して解決する (_work/<session> 実行でも可、マシン非依存)。
      ROBOT_CONFIG: robot_config/mimic_v2_5.json
    inputs:
      tick: dora/timer/millis/3    # 実機 dataflow.yaml と同じ周期 (6軸 moteus)
      motor_commands: web_controller/motor_commands
    outputs:
      - motor_status
      - imu_data
      - latency
      - settings_result
      - param_dump
