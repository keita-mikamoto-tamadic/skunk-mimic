# FOCTIVE モータ単体テスト用 dataflow
#
#   ブラウザ ⇄ foctive_web_gui ──motor_commands / settings_request──▶ device_control_manager ⇄ CAN
#                    ▲──── motor_status / settings_result / param_dump ────┘
#
# 操作 (電圧/電流/速度/位置/OFF)・パラメータ読み書き/キャリブ・モニタを 1 つの Web GUI で行う。
# 電圧制御等は state machine 不要なので RCM をバイパスし motor_commands を直接送る。
#
# 前提:
#   - CAN が UP (PCAN-USB FD: bash scripts/usbcan_setup.bash / Tegra 内蔵: bash scripts/can_setup.bash)
#   - cd src/python && uv sync 済み (Python ノードは run_node.bash 経由で .venv の python で起動)
#
# 起動:
#   dora start dora_dataflow/dataflow_foctive_control.yaml
#   ブラウザで http://<host>:8780/
#
# 別モータ/別 CAN にするときは ROBOT_CONFIG を 2 ノードとも同じファイルに揃える。

nodes:

  - id: foctive_web_gui
    path: ../src/python/run_node.bash
    args: foctive_web_gui/foctive_web_gui.py
    # motor_status の意図的な drop (queue_size: 1) で毎回 WARN が出るので抑制
    min_log_level: error
    env:
      ROBOT_CONFIG: robot_config/foctive_motor_test.json
      FOCTIVE_WEB_GUI_PORT: "8780"
    inputs:
      # 1kHz で来るが GUI は最新値だけでよい (古いものは捨てる)
      motor_status:
        source: device_control_manager/motor_status
        queue_size: 1
      settings_result: device_control_manager/settings_result
      param_dump: device_control_manager/param_dump
    outputs:
      - motor_commands
      - settings_request

  - id: device_control_manager
    path: ../src/cpp/node/device_control_manager/build/device_control_manager
    env:
      ROBOT_CONFIG: robot_config/foctive_motor_test.json
    inputs:
      tick: dora/timer/millis/1
      motor_commands: foctive_web_gui/motor_commands
      settings_request: foctive_web_gui/settings_request
    outputs:
      - motor_status
      - imu_data
      - latency
      - settings_result
      - param_dump
