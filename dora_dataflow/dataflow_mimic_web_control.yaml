# mimic 2チャンネル同時テスト + Web 操作。
#
# robot_config/mimic_v2_5.json
# (comm_ch: can0=右脚 / can1=左脚) で device_control_manager がチャンネル毎に
# ドライバを開き、6軸を2バスに分配する。state machine (robot_control_manager /
# stabilizer) はバイパスし、ブラウザから直接 motor_commands を送る。
#
#   ブラウザ(PC) ──HTTP──▶ web_controller ──motor_commands (変化時のみ)──▶ device_control_manager (can0+can1)
#   (どちらも robot 上で dora が起動。PC はブラウザで繋ぐだけ)
#
# moteus watchdog (100ms) は DCM が最新指令を毎 tick 再送して食わせるため、
# web_controller は変化時に 1 回送るだけでよい。WiFi 瞬断でモータは止まらない
# (止めたい時はブラウザの SERVO OFF。WiFi 断中は止める手段がない点に注意)。
#
# 設定系(settings_request)は対象外 (FOCTIVE の設定は dataflow_foctive_control.yaml の GUI で)。
#
# 起動 (robot):
#   1) bash scripts/pcan_setup.bash can0 can1 keep
#   2) bash scripts/dora_rt_damon.bash
#   3) dora start dora_dataflow/dataflow_mimic_web_control.yaml
#   4) PC のブラウザで http://<robot-ip>:8770/
#   表示側:   ROBOT_CONFIG=robot_config/mimic_v2_5.json python3 tools/gui/web_monitor.py
#             (robot 上なら env 追加不要、PC なら DORA_COORDINATOR_ADDR=<robot-ip>)
#
# topic inspection (web_monitor の dora topic echo) 用に true を維持。
_unstable_debug:
  enable_debug_inspection: true

nodes:

  # 操作ノード ―― HTTP (0.0.0.0:8770) を PC のブラウザから開く。
  # ROBOT_CONFIG は軸名セレクタ / per-axis limits 注入用 (DCM と同じファイル)。
  - id: web_controller
    path: src/python/run_node.bash
    args: web_controller/web_controller.py
    env:
      ROBOT_CONFIG: robot_config/mimic_v2_5.json
    inputs:
      tick: dora/timer/millis/20    # 送信キューを 50Hz で drain
    outputs:
      - motor_commands

  # デバイス側 (can0+can1)。
  - id: device_control_manager
    path: ../src/cpp/node/device_control_manager/build/device_control_manager
    env:
      ROBOT_CONFIG: robot_config/mimic_v2_5.json
    inputs:
      tick: dora/timer/millis/3    # 実機 dataflow.yaml と同じ周期 (6軸 moteus)
      motor_commands: web_controller/motor_commands
    outputs:
      - motor_status
      - imu_data
      - latency
      - settings_result
      - param_dump
